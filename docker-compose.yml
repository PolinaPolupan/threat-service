services:
  postgres:
    image: postgres:17-alpine
    container_name: threat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_create_threats.sql:/docker-entrypoint-initdb.d/001_create_threats.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: threat-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: threat-swagger
    restart: unless-stopped
    environment:
      SWAGGER_JSON: /openapi/openapi.yaml
    ports:
      - "8081:8080"
    volumes:
      - ./api/openapi.yaml:/openapi/openapi.yaml:ro
    depends_on:
      - app

volumes:
  postgres_data:
