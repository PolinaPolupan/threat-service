services:
  postgres:
    image: postgres:17-alpine
    container_name: threat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: threatdb
      POSTGRES_USER: threatuser
      POSTGRES_PASSWORD: local-dev-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatuser -d threatdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
