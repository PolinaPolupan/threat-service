openapi: 3.0.0
info:
  title: Information Exchange Service
  description: API для обмена информацией об угрозах. 
  version: 1.0.0

paths:
  /info/{md5}:
    get:
      summary: Получить информацию об угрозе по MD5
      description: Возвращает полную информацию об угрозе для указанного MD5-хеша.
      operationId: getInfoByMd5
      parameters:
        - name: md5
          in: path
          required: true
          description: MD5-хеш файла (32 символа, шестнадцатеричные цифры)
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{32}$'
            example: "d41d8cd98f00b204e9800998ecf8427e"
      responses:
        '200':
          description: Успешный ответ с информацией об угрозе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatResponse'
        '404':
          description: Угроза с указанным MD5 не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Некорректный формат MD5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Обновить информацию об угрозе по MD5
      description: Обновляет переданные поля существующей угрозы. Поля, отсутствующие в запросе, сохраняют прежние значения.
      operationId: updateThreat
      parameters:
        - name: md5
          in: path
          required: true
          description: MD5-хеш обновляемой записи
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{32}$'
            example: "d41d8cd98f00b204e9800998ecf8427e"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatUpdateRequest'
      responses:
        '200':
          description: Информация успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatResponse'
        '400':
          description: Некорректные данные запроса или MD5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Угроза с указанным MD5 не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /info:
    post:
      summary: Создать новую запись об угрозе
      description: Добавляет новую информацию об угрозе. MD5 должен быть уникальным.
      operationId: createThreat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatCreateRequest'
      responses:
        '201':
          description: Запись успешно создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatResponse'
        '400':
          description: Некорректные данные запроса (например, невалидный MD5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Угроза с таким MD5 уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Threat:
      type: object
      required:
        - md5
        - name
      properties:
        md5:
          type: string
          pattern: '^[a-fA-F0-9]{32}$'
        sha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 5000
        type:
          type: string
          enum:
            - trojan
            - ransomware
            - worm
            - virus
            - spyware
            - rootkit
            - adware
            - other
        severity:
          type: string
          enum:
            - low
            - medium
            - high
            - critical
        fileName:
          type: string
          maxLength: 255
        fileSize:
          type: integer
          format: int64
          minimum: 0
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
        source:
          type: string
          maxLength: 255
        tags:
          type: array
          items:
            type: string
            maxLength: 64
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    ThreatCreateRequest:
      type: object
      required:
        - md5
        - name
      additionalProperties: false
      properties:
        md5:
          type: string
          pattern: '^[a-fA-F0-9]{32}$'
        sha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 5000
        type:
          type: string
          enum:
            - trojan
            - ransomware
            - worm
            - virus
            - spyware
            - rootkit
            - adware
            - other
        severity:
          type: string
          enum:
            - low
            - medium
            - high
            - critical
        fileName:
          type: string
          maxLength: 255
        fileSize:
          type: integer
          format: int64
          minimum: 0
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
        source:
          type: string
          maxLength: 255
        tags:
          type: array
          items:
            type: string
            maxLength: 64

    ThreatUpdateRequest:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        sha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
        description:
          type: string
          maxLength: 5000
        type:
          type: string
          enum:
            - trojan
            - ransomware
            - worm
            - virus
            - spyware
            - rootkit
            - adware
            - other
        severity:
          type: string
          enum:
            - low
            - medium
            - high
            - critical
        fileName:
          type: string
          maxLength: 255
        fileSize:
          type: integer
          format: int64
          minimum: 0
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
        source:
          type: string
          maxLength: 255
        tags:
          type: array
          items:
            type: string
            maxLength: 64

    ThreatResponse:
      allOf:
        - $ref: '#/components/schemas/Threat'

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        details:
          type: string
